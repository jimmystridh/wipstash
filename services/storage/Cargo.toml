[package]
name = "wipstash-storage"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
fs2 = "0.4"
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[test]]
name = "sqlite_runtime"
path = "../../tests/sqlite_runtime.rs"
