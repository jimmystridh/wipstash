[package]
name = "wipstash-inspector"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
url = "2"

[[test]]
name = "sqlite_runtime"
path = "../../tests/sqlite_runtime.rs"
