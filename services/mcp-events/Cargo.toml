[package]
name = "wipstash-mcp-events"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional read-only Wipstash MCP Events and GitHub identity service"

[dependencies]
wipstash-transport = { path = "../transport" }
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
zeroize = "1"
subtle = "2.6"
base64 = "0.22"
url = "2"
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "webpki-roots", "ring"] }
webpki-roots = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "sqlite_runtime"
path = "../../tests/sqlite_runtime.rs"
