[package]
name = "wipstash"
version = "0.1.0"
edition = "2021"
description = "Local-first isolated agent workspace prototype"
license = "MIT"
default-run = "wip"

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
fs2 = "0.4"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wipstash-transport = { path = "services/transport" }
wipstash-repair-runner = { path = "crates/repair-runner" }
wipstash-platform = { path = "crates/platform" }

# Reuse transport's reviewed native private-file primitives without duplicating
# platform-specific path, ownership, DACL, or reparse-point validation.
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
