name: Native builds and contracts
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # Bash exits on any failing native command on every runner, including Windows.
    # PowerShell otherwise lets a later successful command mask cargo failures.
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core and compile all core tests
        run: |
          cargo build --locked
          cargo test --locked --no-run
      - name: Core MCP contracts
        run: |
          cargo test --locked client::tests
          cargo test --locked policy::command_contract_tests
          cargo test --locked git::tests::canonical_directory_components_include_root_not_bare_prefix
          cargo test --locked git::tests::exact_roundtrip_and_exclusions
          cargo test --locked canonical_local_repository_transfer_opens_two_workspaces
          cargo test --locked local_repository_transport_blocks_configured_remote_helpers
          python tests/mcp_protocol.py
          python tests/sync_peer_authorization.py
      - name: Native platform contracts
        run: cargo test --locked --manifest-path crates/platform/Cargo.toml
      - name: Read-only inspector contracts
        run: cargo test --locked --manifest-path services/inspector/Cargo.toml
      - name: Build authenticated transport
        run: cargo build --locked --manifest-path services/transport/Cargo.toml
      - name: Guided pairing contracts
        run: |
          cargo test --locked --manifest-path services/transport/Cargo.toml --lib pairing
          cargo test --locked --manifest-path services/transport/Cargo.toml --lib managed_service_tests
      - name: Enrollment TLS contracts
        run: cargo test --locked --manifest-path services/transport/Cargo.toml --lib enrollment
      - name: Four-device guided pairing over real loopback TLS
        env:
          WIPSTASH_PAIRING_LIVE_CI: '1'
        run: python tests/pairing_live_ci.py --artifacts evidence/pairing-live
      - name: Save redacted pairing acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairing-live-${{ runner.os }}-${{ github.sha }}
          path: |
            evidence/pairing-live/summary.json
            evidence/pairing-live/safe-stderr.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Native storage admission and Git paths
        run: |
          cargo test --locked --manifest-path services/storage/Cargo.toml canonical_roots_preserve_admission_checks
          cargo test --locked --manifest-path services/storage/Cargo.toml canonical_git_view_reads_local_objects
      - name: Native resumable storage contracts
        run: |
          cargo test --locked --manifest-path services/transport/Cargo.toml --lib resumable
          cargo test --locked --manifest-path services/transport/Cargo.toml --test resumable
      - name: Build remote backup component
        run: cargo build --locked --manifest-path services/backup/Cargo.toml
      - name: Native backup local paths and protocol boundaries
        run: |
          cargo test --locked --manifest-path services/backup/Cargo.toml canonical_local_enqueue_preserves_identity
          cargo test --locked --manifest-path services/backup/Cargo.toml git_protocol_defaults_and_github_override_are_separate
      - name: Verify linked SQLite runtime on every platform
        run: |
          for manifest in Cargo.toml services/storage/Cargo.toml services/backup/Cargo.toml services/transport/Cargo.toml simulations/wan/Cargo.toml services/inspector/Cargo.toml; do
            cargo test --locked --manifest-path "$manifest" --test sqlite_runtime -- --nocapture
          done
      - name: Full Linux suites
        if: runner.os == 'Linux'
        run: |
          cargo test --locked
          cargo test --locked --manifest-path services/transport/Cargo.toml
          cargo test --locked --manifest-path services/backup/Cargo.toml
          cargo test --locked --manifest-path services/storage/Cargo.toml
          cargo test --locked --manifest-path crates/repair-runner/Cargo.toml
          cargo test --locked --manifest-path simulations/wan/Cargo.toml
          python tests/adversarial.py
          python tests/gap_closure.py
          python tests/source_sync.py
          cargo build --locked --manifest-path services/inspector/Cargo.toml
          python tests/inspector_security.py
          rustc --edition=2021 --test tests/inspector_diff.rs -o target/inspector-diff-tests
          target/inspector-diff-tests
      - name: Formatting and strict Clippy
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path crates/platform/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/platform/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/transport/Cargo.toml --check
          cargo clippy --locked --manifest-path services/transport/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/backup/Cargo.toml --check
          cargo clippy --locked --manifest-path services/backup/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/storage/Cargo.toml --check
          cargo clippy --locked --manifest-path services/storage/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/repair-runner/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/repair-runner/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/inspector/Cargo.toml --check
          cargo clippy --locked --manifest-path services/inspector/Cargo.toml --all-targets -- -D warnings
  inspector-browser:
    name: Dioxus WASM and browser inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check real Dioxus UI
        run: |
          cargo test --locked --manifest-path apps/inspector/Cargo.toml
          cargo fmt --manifest-path apps/inspector/Cargo.toml --check
          cargo clippy --locked --manifest-path apps/inspector/Cargo.toml --all-targets -- -D warnings
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python apps/inspector/scripts/build.py
      - name: Generate real four-workspace inspector fixture
        run: |
          cargo build --locked
          cargo build --locked --manifest-path services/inspector/Cargo.toml
          python tests/inspector_security.py --artifacts evidence/inspector/ci-fixture
      - name: Exercise browser against read-only API
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/inspector_browser.py --assets apps/inspector/dist --fixture evidence/inspector/ci-fixture/fixture.json --artifacts evidence/inspector/browser
          python tests/inspector_browser.py --assets apps/inspector/dist --fixture evidence/inspector/ci-fixture/fixture.json --artifacts evidence/inspector/browser-live --live-server
      - name: Save browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-browser-${{ github.sha }}
          path: |
            evidence/inspector/browser/
            evidence/inspector/browser-live/
            evidence/inspector/ci-fixture/security-results.json
          if-no-files-found: warn
          retention-days: 7
