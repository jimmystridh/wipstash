name: Native builds and contracts
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # Bash exits on any failing native command on every runner, including Windows.
    # PowerShell otherwise lets a later successful command mask cargo failures.
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core and compile all core tests
        run: |
          cargo build --locked
          cargo test --locked --no-run
      - name: Concurrent SQLite reopen and durable writes
        run: cargo test --locked --test sqlite_concurrency -- --nocapture
      - name: Prepare Linux core benchmark artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p evidence/core-binary
          cp target/debug/wipstash evidence/core-binary/wipstash
          python - <<'PYMETA'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          binary = Path('evidence/core-binary/wipstash')
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          Path('evidence/core-binary/SHA256SUMS').write_text(digest + '  wipstash\n')
          metadata = {
              'commit': os.environ['GITHUB_SHA'],
              'sha256': digest,
              'bytes': binary.stat().st_size,
              'runner_os': os.environ['RUNNER_OS'],
              'architecture': platform.machine(),
              'libc': list(platform.libc_ver()),
              'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
              'cargo': subprocess.check_output(['cargo', '--version'], text=True).strip(),
              'profile': 'debug',
          }
          Path('evidence/core-binary/metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYMETA
      - name: Save Linux core benchmark executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: core-binary-Linux-${{ github.sha }}
          path: |
            evidence/core-binary/wipstash
            evidence/core-binary/SHA256SUMS
            evidence/core-binary/metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Core MCP contracts
        run: |
          cargo test --locked client::tests
          cargo test --locked policy::command_contract_tests
          cargo test --locked git::tests::canonical_directory_components_include_root_not_bare_prefix
          cargo test --locked git::tests::exact_roundtrip_and_exclusions
          cargo test --locked canonical_local_repository_transfer_opens_two_workspaces
          cargo test --locked local_repository_transport_blocks_configured_remote_helpers
          python tests/mcp_protocol.py
          python tests/sync_peer_authorization.py
      - name: Agent conflict resolution core contracts
        run: |
          cargo test --locked engine::regression_tests::resolution_
          cargo test --locked --bin wipstash engine::regression_tests::publication_
          cargo test --locked --bin wipstash git::tests::immutable_reference_creation_never_replaces_existing_pins
          python tests/test_agent_conflict_stress_harness.py
      - name: Read-only MCP Events and GitHub identity contracts
        run: cargo test --locked --manifest-path services/mcp-events/Cargo.toml -- --show-output
      - name: Native platform contracts
        run: cargo test --locked --manifest-path crates/platform/Cargo.toml
      - name: Read-only inspector contracts
        run: cargo test --locked --manifest-path services/inspector/Cargo.toml
      - name: Build authenticated transport
        run: cargo build --locked --manifest-path services/transport/Cargo.toml
      - name: Guided pairing contracts
        run: |
          cargo test --locked --manifest-path services/transport/Cargo.toml --lib pairing
          cargo test --locked --manifest-path services/transport/Cargo.toml --lib managed_service_tests
      - name: Enrollment TLS contracts
        run: cargo test --locked --manifest-path services/transport/Cargo.toml --lib enrollment
      - name: Four-device guided pairing over real loopback TLS
        env:
          WIPSTASH_PAIRING_LIVE_CI: '1'
        run: python tests/pairing_live_ci.py --artifacts evidence/pairing-live
      - name: Save redacted pairing acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairing-live-${{ runner.os }}-${{ github.sha }}
          path: |
            evidence/pairing-live/summary.json
            evidence/pairing-live/safe-stderr.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Real TLS resumable transfer and application-fault campaign
        if: runner.os == 'Linux'
        env:
          WIPSTASH_LIVE_TLS_CI: '1'
          WIPSTASH_LIVE_TLS_ARTIFACT_DIR: ${{ github.workspace }}/evidence/live-tls
        run: cargo test --locked --manifest-path services/transport/Cargo.toml --test live_tls_ci four_devices_live_tls_restart_and_faults -- --ignored --nocapture
      - name: Save bounded TLS fault evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: live-tls-faults-${{ github.sha }}
          path: |
            evidence/live-tls/summary.json
            evidence/live-tls/server.log
          if-no-files-found: warn
          retention-days: 7
      - name: Native storage admission and Git paths
        run: |
          cargo test --locked --manifest-path services/storage/Cargo.toml canonical_roots_preserve_admission_checks
          cargo test --locked --manifest-path services/storage/Cargo.toml canonical_git_view_reads_local_objects
      - name: Native resumable storage contracts
        run: |
          cargo test --locked --manifest-path services/transport/Cargo.toml --lib resumable
          cargo test --locked --manifest-path services/transport/Cargo.toml --test resumable
      - name: Build remote backup component
        run: cargo build --locked --manifest-path services/backup/Cargo.toml
      - name: Native backup local paths and protocol boundaries
        run: |
          cargo test --locked --manifest-path services/backup/Cargo.toml canonical_local_enqueue_preserves_identity
          cargo test --locked --manifest-path services/backup/Cargo.toml git_protocol_defaults_and_github_override_are_separate
      - name: Verify linked SQLite runtime on every platform
        run: |
          for manifest in Cargo.toml services/storage/Cargo.toml services/backup/Cargo.toml services/transport/Cargo.toml simulations/wan/Cargo.toml services/inspector/Cargo.toml services/mcp-events/Cargo.toml; do
            cargo test --locked --manifest-path "$manifest" --test sqlite_runtime -- --nocapture
          done
      - name: Full Linux suites
        if: runner.os == 'Linux'
        run: |
          cargo test --locked
          cargo test --locked --manifest-path services/transport/Cargo.toml
          cargo test --locked --manifest-path services/backup/Cargo.toml
          cargo test --locked --manifest-path services/storage/Cargo.toml
          cargo test --locked --manifest-path crates/repair-runner/Cargo.toml
          cargo test --locked --manifest-path simulations/wan/Cargo.toml
          python tests/adversarial.py
          python tests/gap_closure.py
          python tests/source_sync.py
          cargo build --locked --manifest-path services/inspector/Cargo.toml
          python tests/inspector_security.py
          rustc --edition=2021 --test tests/inspector_diff.rs -o target/inspector-diff-tests
          target/inspector-diff-tests
      - name: Formatting and strict Clippy
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path crates/platform/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/platform/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/transport/Cargo.toml --check
          cargo clippy --locked --manifest-path services/transport/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/backup/Cargo.toml --check
          cargo clippy --locked --manifest-path services/backup/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/storage/Cargo.toml --check
          cargo clippy --locked --manifest-path services/storage/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/repair-runner/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/repair-runner/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/inspector/Cargo.toml --check
          cargo clippy --locked --manifest-path services/inspector/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path services/mcp-events/Cargo.toml --check
          cargo clippy --locked --manifest-path services/mcp-events/Cargo.toml --all-targets -- -D warnings
  conflict-stress:
    name: Agent conflict stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core for isolated conflict stress
        run: cargo build --locked
      - name: Four-actor agent conflict stress campaign
        env:
          WIPSTASH_CONFLICT_STRESS_CI: '1'
          WIPSTASH_SQLITE_DIAGNOSTICS: '1'
        run: |
          seeds="731927"
          if [[ "${{ runner.os }}" == "Linux" || "${{ runner.os }}" == "Windows" ]]; then
            seeds="731927 991337 20261018"
          fi
          for seed in $seeds; do
            python tests/agent_conflict_stress.py --seed "$seed" --artifacts "evidence/agent-conflict/$seed"
          done
      - name: Save bounded agent conflict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-conflict-${{ runner.os }}-${{ github.sha }}
          path: |
            evidence/agent-conflict/731927/summary.json
            evidence/agent-conflict/991337/summary.json
            evidence/agent-conflict/20261018/summary.json
          if-no-files-found: warn
          retention-days: 7
  inspector-browser:
    name: Dioxus WASM and browser inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check real Dioxus UI
        run: |
          cargo test --locked --manifest-path apps/inspector/Cargo.toml
          cargo fmt --manifest-path apps/inspector/Cargo.toml --check
          cargo clippy --locked --manifest-path apps/inspector/Cargo.toml --all-targets -- -D warnings
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python apps/inspector/scripts/build.py
      - name: Generate real four-workspace inspector fixture
        run: |
          cargo build --locked
          cargo build --locked --manifest-path services/inspector/Cargo.toml
          python tests/inspector_security.py --artifacts evidence/inspector/ci-fixture
      - name: Exercise browser against read-only API
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/inspector_browser.py --assets apps/inspector/dist --fixture evidence/inspector/ci-fixture/fixture.json --artifacts evidence/inspector/browser
          python tests/inspector_browser.py --assets apps/inspector/dist --fixture evidence/inspector/ci-fixture/fixture.json --artifacts evidence/inspector/browser-live --live-server
      - name: Save browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-browser-${{ github.sha }}
          path: |
            evidence/inspector/browser/
            evidence/inspector/browser-live/
            evidence/inspector/ci-fixture/security-results.json
          if-no-files-found: warn
          retention-days: 7
  ergonomics:
    name: Agent ergonomics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core and test durable journal boundaries
        run: |
          cargo build --locked
          cargo test --locked client_journal::tests -- --show-output
          cargo test --locked adoption::tests -- --show-output
          cargo test --locked --manifest-path services/transport/Cargo.toml pairing_files -- --show-output
      - name: Client helper and pressure harness regressions
        run: |
          binary="$(python -c 'import os,pathlib; print((pathlib.Path("target/debug") / ("wipstash.exe" if os.name == "nt" else "wipstash")).resolve())')"
          export WIPSTASH_CLIENT_SMOKE_BINARY="$binary"
          export WIPSTASH_CLIENT_JOURNAL_BINARY="$binary"
          python -m unittest discover -s tests -p 'test_wipstash_client.py' -v
          python -m unittest discover -s tests -p 'test_agent_ergonomics_pressure.py' -v
      - name: Required-check real stdio ergonomics campaign
        env:
          WIPSTASH_ERGONOMICS_CI: '1'
        run: python tests/agent_ergonomics_pressure.py --required-checks-ci --artifacts evidence/agent-ergonomics
      - name: Save sanitized ergonomics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ergonomics-${{ runner.os }}-${{ github.sha }}
          path: evidence/agent-ergonomics/summary.json
          if-no-files-found: warn
          retention-days: 7
