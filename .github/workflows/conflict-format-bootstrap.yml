# Temporary branch-only formatting helper. Remove before main promotion.
name: Conflict workflow formatting bootstrap
on:
  push:
    branches: [agent-conflict-resolution]
permissions:
  contents: read
concurrency:
  group: conflict-format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rustfmt-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Format source without changing native gates
        run: |
          for manifest in Cargo.toml crates/platform/Cargo.toml crates/repair-runner/Cargo.toml services/backup/Cargo.toml services/inspector/Cargo.toml services/storage/Cargo.toml services/transport/Cargo.toml simulations/wan/Cargo.toml apps/inspector/Cargo.toml; do
            cargo fmt --manifest-path "$manifest"
          done
          mkdir -p evidence/conflict-format
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          changes = []
          for name in filter(None, paths):
              if not name.endswith('.rs'):
                  raise SystemExit('Formatter unexpectedly modified a non-Rust file')
              before = subprocess.check_output(['git', 'show', f'HEAD:{name}'])
              after = Path(name).read_bytes()
              changes.append({'path': name, 'before_sha256': hashlib.sha256(before).hexdigest(), 'after_sha256': hashlib.sha256(after).hexdigest(), 'bytes': len(after)})
          patch = subprocess.check_output(['git', 'diff', '--binary', '--', '*.rs'])
          if len(patch) > 2_000_000:
              raise SystemExit('Formatting patch exceeds bounded artifact limit')
          Path('evidence/conflict-format/rustfmt.patch').write_bytes(patch)
          Path('evidence/conflict-format/manifest.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'changes': changes, 'patch_sha256': hashlib.sha256(patch).hexdigest()}, indent=2) + '\n')
          PY
      - name: Save reviewed-source formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: conflict-format-${{ github.sha }}
          path: |
            evidence/conflict-format/manifest.json
            evidence/conflict-format/rustfmt.patch
          if-no-files-found: error
          retention-days: 7
