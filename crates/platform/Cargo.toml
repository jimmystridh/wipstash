[package]
name = "wipstash-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed native process lifecycle and local IPC identity adapters"

[dependencies]
zeroize = "1"

[workspace]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes"] }
