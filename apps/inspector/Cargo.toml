[package]
name = "wipstash-inspector-ui"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlElement", "Storage"] }

[dev-dependencies]
dioxus-ssr = "=0.7.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
